<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#146c6e" />
    <title>ChemLab-G9 下册｜九年级化学</title>
    <style>
:root {
  color-scheme: light;
  --ink: #173033;
  --muted: #587073;
  --paper: #f2f8f7;
  --surface: #ffffff;
  --line: #d9e8e5;
  --brand: #146c6e;
  --brand-strong: #0d5f61;
  --brand-soft: #e2f4f1;
  --accent: #e67b32;
  --ok: #2e9e63;
  --ko: #d0544e;
  --shadow-sm: 0 1px 2px rgba(23, 48, 51, .06);
  --shadow-md: 0 6px 18px rgba(23, 48, 51, .1);
  --grad-hero: linear-gradient(135deg, #0d5f61 0%, #2f9aa8 58%, #52b6a4 100%);
  --radius: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-size: 17px; line-height: 1.75; }
button { min-height: 44px; font: inherit; cursor: pointer; }
a { color: var(--brand); }

.page { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 56px; }

/* ---------- 首页 Hero：品牌渐变 + 白字 ---------- */
.hero {
  background: var(--grad-hero);
  color: #fff;
  border-radius: var(--radius);
  padding: clamp(24px, 5vw, 44px);
  box-shadow: var(--shadow-md);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -60px;
  top: -60px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .08);
}
.hero .eyebrow { color: rgba(255, 255, 255, .75); font-weight: 800; letter-spacing: .12em; margin: 0; }
.hero h1 { font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.2; margin: 10px 0 6px; }
.hero .meta { color: rgba(255, 255, 255, .85); margin: 0; }
.hero .hint { color: rgba(255, 255, 255, .92); }
.hero a { color: #fff; font-weight: 700; }

.section, .quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(20px, 4vw, 34px); margin-top: 18px; box-shadow: var(--shadow-sm); }
h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; margin: 8px 0; }
h2 { font-size: 1.3rem; line-height: 1.35; margin-top: 0; }
h2 .day-badge { font-size: .78rem; font-weight: 700; margin-right: 6px; padding: 2px 10px; border-radius: 999px; }
.meta, .hint { color: var(--muted); }
.loading { color: var(--muted); }

/* ---------- 结论 / 提示高亮块 ---------- */
.takeaway {
  background: var(--brand-soft);
  border-left: 4px solid var(--brand);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 14px 0;
  font-weight: 600;
}
.note-block {
  background: #fff8ef;
  border-left: 4px solid var(--accent);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 14px 0;
}

/* ---------- 练习 ---------- */
.question { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 20px; }
.question legend { padding: 0 4px; }
.option { display: flex; align-items: flex-start; gap: 10px; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px; margin: 10px 0; transition: border-color .15s ease, background .15s ease, transform .12s ease; }
.option input { margin-top: 6px; flex: none; width: 20px; height: 20px; accent-color: var(--brand); }
.option:active { transform: scale(.995); }
.option:has(input:checked), .option.selected { border-color: var(--brand); background: var(--brand-soft); }
.option.is-correct { border-color: var(--ok); background: #e6f6ee; }
.option.is-wrong { border-color: var(--ko); background: #fdeeed; }
.option.is-marked { border-color: var(--ok); background: #e6f6ee; }
.primary { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; margin-top: 12px; font-weight: 700; box-shadow: var(--shadow-sm); }
.primary:hover, .primary:active { background: var(--brand-strong); }
.primary:disabled { opacity: .55; cursor: not-allowed; }
.result { font-weight: 700; margin: 16px 0 0; outline: none; }
.warning { color: var(--accent); font-weight: 700; }
.breadcrumb { margin: 0; }
.breadcrumb a { color: var(--brand); text-decoration: none; font-weight: 700; }

/* 复习页：底部返回首页链接 */
.back-home { margin: 24px auto 8px; text-align: center; }
.back-home a { color: var(--brand); text-decoration: none; font-weight: 700; }

/* 练习区：题号进度条 */
.quiz-progress { display: flex; align-items: center; gap: 12px; margin: 10px 0 4px; }
.quiz-progress .qp-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--brand-soft); overflow: hidden; }
.quiz-progress .qp-fill { height: 100%; background: var(--brand); border-radius: 999px; transition: width .25s ease; }
.quiz-progress .qp-text { font-size: .85rem; font-weight: 700; color: var(--muted); white-space: nowrap; }

/* 题目标签：难度 + 知识点 */
.q-tags { display: inline-flex; gap: 6px; margin-right: 8px; vertical-align: middle; }
.q-diff, .q-topic { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.q-diff[data-diff="基础"] { background: var(--brand-soft); color: var(--brand); }
.q-diff[data-diff="提升"] { background: #fdecd9; color: #a4560b; }
.q-diff[data-diff="挑战"] { background: #f6d9d0; color: #b0400f; }
.q-topic { background: #eef1f4; color: #5a6a72; }

/* 反馈动效 */
.feedback { margin-top: 10px; font-weight: 700; }
.feedback.fb-ok { color: var(--ok); animation: pulse-ok .7s ease; }
.feedback.fb-ko { color: var(--ko); animation: shake .45s ease; }
@keyframes pulse-ok { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 55% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }

/* ---------- 首页：进度条 ---------- */
.progress-bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, .22); overflow: hidden; margin-top: 14px; }
.progress-bar-fill { height: 100%; background: #fff; border-radius: 999px; transition: width .4s ease; }

/* ---------- 首页：激励区（连续天数 / 今日战绩） ---------- */
.stats-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.stat-chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: .9rem; }
.stat-chip b { font-size: 1.05rem; }

/* ---------- 首页：学习日网格（按模块着色） ---------- */
.day-grid { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.day-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform .12s ease, box-shadow .12s ease; position: relative; }
.day-card::before { content: ""; display: block; height: 5px; background: var(--mod); }
.day-check { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; font-size: .8rem; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.day-card:active { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.day-card-link { display: flex; flex-direction: column; gap: 4px; padding: 14px; min-height: 60px; text-decoration: none; color: inherit; }
.day-card.is-done { border-color: var(--mod); background: var(--brand-soft); }
.day-card.is-locked { opacity: .55; border-style: dashed; }
.day-card-link.is-disabled { cursor: not-allowed; }
.day-num { font-weight: 800; color: var(--mod); letter-spacing: .05em; font-size: .85rem; }
.day-title { font-weight: 600; line-height: 1.4; }
.day-status { color: var(--muted); font-size: .85rem; }

/* 模块色 */
.mod-0 { --mod: #146c6e; }
.mod-1 { --mod: #2a7ab5; }
.mod-2 { --mod: #6b5ba8; }
.mod-3 { --mod: #2f9aa8; }
.mod-4 { --mod: #d9762b; }
.mod-5 { --mod: #8a6a4b; }
.mod-6 { --mod: #c2534f; }
.mod-7 { --mod: #b08a2e; }

/* ---------- 首页：模块进度（可展开） ---------- */
.mod-section { margin-top: 18px; }
.mod-block { border-bottom: 1px dashed var(--line); }
.mod-block:last-child { border-bottom: 0; }
.mod-block summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 2px; cursor: pointer; }
.mod-block summary::-webkit-details-marker { display: none; }
.mod-block summary::after { content: "▾"; color: var(--muted); font-size: .8rem; transition: transform .15s ease; }
.mod-block[open] summary::after { transform: rotate(180deg); }
.mod-row { display: flex; align-items: center; gap: 12px; }
.mod-ring { width: 40px; height: 40px; flex: none; }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 5; }
.ring-fg { fill: none; stroke: var(--mod); stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray .4s ease; }
.mod-name { font-weight: 600; flex: 1; color: var(--mod); }
.mod-count { color: var(--muted); font-size: .9rem; }
.mod-days { list-style: none; margin: 0 0 8px 52px; padding: 0; }
.mod-days li { font-size: .92rem; padding: 3px 0; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.mod-days li b { color: var(--ink); }

/* 卡片内成长小折线 */
.mini-chart { width: 100%; height: 20px; margin-top: 6px; }
.mini-chart polyline { fill: none; stroke: var(--mod); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 成就徽章 ---------- */
.badge-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
.badge-item { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.badge-item .b-ico { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 800; color: #fff; }
.badge-item .b-name { font-size: .82rem; font-weight: 700; }
.badge-item .b-desc { font-size: .74rem; color: var(--muted); line-height: 1.4; }
.badge-item.is-locked { opacity: .5; filter: grayscale(1); }
.b-ico.b-ico-0 { background: #146c6e; }
.b-ico.b-ico-1 { background: #2a7ab5; }
.b-ico.b-ico-2 { background: #6b5ba8; }
.b-ico.b-ico-3 { background: #2f9aa8; }
.b-ico.b-ico-4 { background: #d9762b; }
.b-ico.b-ico-5 { background: #c2534f; }
.b-ico.b-ico-6 { background: #b08a2e; }
.b-ico.b-ico-7 { background: #3b7c5c; }

/* ---------- 薄弱知识点 ---------- */
.weak-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.weak-tag { display: inline-flex; align-items: center; gap: 6px; background: #fdeeed; color: #b0400f; border: 1px solid #f3c3bd; border-radius: 999px; padding: 3px 12px; font-size: .85rem; font-weight: 600; text-decoration: none; }
.weak-tag:hover, .weak-tag:active { background: #fbd9d4; border-color: #e07a6f; }
.weak-tag b { font-size: .9rem; }

/* ---------- 实验安全徽章 ---------- */
.badge { display: inline-block; font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; vertical-align: middle; }
.badge-safety { background: #fdecd9; color: #a4560b; }

/* ---------- 情境自测 ---------- */
.checkpoint-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
.checkpoint-item summary { cursor: pointer; font-weight: 600; }
.checkpoint-item p { margin: 10px 0 0; color: var(--muted); }

/* ---------- 内容配图 ---------- */
.chem-fig { margin: 18px auto 6px; text-align: center; max-width: 520px; }
.chem-svg { width: 100%; height: auto; display: block; margin: 0 auto; }
.fig-cap { margin-top: 10px; color: var(--muted); font-size: .9rem; line-height: 1.6; }

/* 量筒读数交互控件 */
.fig-cyl { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fig-ctrl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.fig-pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 44px; font-weight: 600; color: var(--ink); }
.fig-pill.is-active, .fig-pill:active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.fig-cyl .cyl-note { font-weight: 600; margin: 4px 0 0; font-size: .9rem; line-height: 1.6; max-width: 300px; }
.fig-air .air-result { margin: 4px 0 0; font-size: .88rem; line-height: 1.6; color: var(--ink); max-width: 340px; }

/* 量筒读数：眼睛、视线、读数标记 */
.cyl-eye-body { transform-origin: center; transition: all .3s ease; }
.cyl-pupil { transform-origin: center; transition: cx .3s ease, cy .3s ease; }
.cyl-sight line { stroke-linecap: round; }
.cyl-read { r: 5; transition: cx .3s ease, cy .3s ease; }
.cyl-read.is-wrong { fill: #e67b32; animation: pulse-wrong .8s ease; transform-box: fill-box; transform-origin: center; }
@keyframes pulse-wrong { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

/* 气密性：手、导管、漏气状态 */
.air-hand { transform-origin: 50% 50%; animation: handPress 2s ease-in-out infinite; }
@keyframes handPress { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
.air-pipe { transition: opacity .3s ease; }
.air-bubbles.is-leak .bub { animation: leakBubbles 3s linear infinite; }
.air-water.is-leak { opacity: .35; }
@keyframes leakBubbles {
  0% { opacity: 0; transform: translate(0, 14px) scale(.5); }
  10% { opacity: .3; }
  100% { opacity: 0; transform: translate(0, -18px) scale(1); }
}

/* 气密性交互控件 */
.fig-air { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fig-air .fig-pill { min-width: 110px; }

/* 空气成分环形图 */
.air-wrap { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
.air-wrap .chem-svg { width: 180px; }
.air-legend-box { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: .92rem; }
.air-legend { display: flex; align-items: center; gap: 8px; }
.air-legend .swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; }

/* 蜡烛燃烧 */
.fig-candle { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.candle-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.candle-flame { transition: opacity .5s ease; }
.candle-smoke { transition: opacity .5s ease; }
.candle-wax { transition: opacity .5s ease; }
.candle-products { transition: opacity .5s ease; }
.candle-melt { transition: opacity .5s ease; }

/* 物质变化判断器 */
.fig-judge { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.judge-grid { gap: 8px; }
.judge-btn.is-active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.judge-result { font-size: .9rem; line-height: 1.6; text-align: left; width: 100%; padding: 10px 12px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }

/* 科学探究排序 */
.fig-inquiry { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.inq-instruct { font-size: .88rem; color: var(--muted); margin: 0; }
.inq-slots { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 320px; }
.inq-slot { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 10px; border: 2px dashed var(--line); border-radius: 8px; background: var(--paper); transition: border-color .2s, background .2s; }
.inq-slot.is-drop-target { border-color: var(--brand); background: var(--brand-soft); }
.slot-num { font-weight: 700; color: var(--brand); font-size: .9rem; min-width: 18px; }
.slot-hint { color: var(--muted); font-size: .82rem; }
.inq-drag { display: inline-flex; align-items: center; padding: 6px 12px; background: var(--surface); border: 1px solid var(--brand); border-radius: 6px; font-size: .85rem; font-weight: 600; color: var(--brand); cursor: grab; user-select: none; transition: opacity .2s; }
.inq-drag:active { cursor: grabbing; }
.inq-drag.is-dragging { opacity: .5; }
.inq-ctrl { display: flex; gap: 8px; }
.inq-result { font-size: .88rem; width: 100%; text-align: center; }

/* 红磷燃烧 */
.fig-rp { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.rp-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.rp-flame { animation: rpFlame 0.4s ease-in-out infinite alternate; }
@keyframes rpFlame { from { opacity: .8; } to { opacity: 1; } }
.rp-smoke1, .rp-smoke2 { animation: rpSmoke 2s ease-out infinite; }
.rp-smoke2 { animation-delay: 0.6s; }
@keyframes rpSmoke { 0% { opacity: 0.6; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-12px); } }

/* 氧气燃烧 */
.fig-oc { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.oc-result { font-size: .88rem; text-align: left; width: 100%; padding: 10px 12px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }
.oc-name { margin: 0 0 4px; font-weight: 700; color: var(--brand); }
.oc-detail { margin: 0; color: var(--muted); font-family: monospace; font-size: .85rem; }

/* 高锰酸钾装置 */
.fig-km { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.km-result { font-size: .88rem; width: 100%; text-align: left; padding: 8px 10px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); margin-top: 4px; }
.km-flame { animation: kmFlame 0.3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
@keyframes kmFlame { from { transform: scaleY(0.88); } to { transform: scaleY(1.1); } }
.km-tube.is-hot, .km-cotton.is-hot, .km-heat.is-hot, .km-collect.is-hot { filter: drop-shadow(0 0 4px rgba(230,123,50,.75)); }
.km-bubbles circle { animation: kmBubble 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.km-bubbles circle:nth-child(2) { animation-delay: .25s; }
.km-bubbles circle:nth-child(3) { animation-delay: .5s; }
.km-bubbles circle:nth-child(4) { animation-delay: .7s; }
.km-bubbles circle:nth-child(5) { animation-delay: .35s; }
@keyframes kmBubble {
  0% { opacity: 0; transform: translateY(5px) scale(.8); }
  30% { opacity: .9; }
  100% { opacity: 0; transform: translateY(-6px) scale(1.1); }
}

/* 分子运动 */
.fig-mol { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mol-desc { font-size: .88rem; text-align: left; width: 100%; padding: 8px 10px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }
.mol-state-name { margin: 0 0 2px; font-weight: 700; color: var(--brand); }
.mol-desc-text { margin: 0; color: var(--muted); }
.mol-particle { transition: opacity .3s ease; }
.mol-particle.is-active { animation: molBounce 0.6s ease-in-out infinite; }
@keyframes molBounce { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(2px, -1px); } }
.mol-gas .mol-particle.is-active { animation: molGasMove 1.2s ease-in-out infinite; }
@keyframes molGasMove {
  0% { transform: translate(0, 0); }
  25% { transform: translate(3px, -2px); }
  50% { transform: translate(-1px, 3px); }
  75% { transform: translate(-3px, -1px); }
  100% { transform: translate(0, 0); }
}

/* 原子结构模型 */
.fig-atom { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.atom-info { font-size: .88rem; width: 100%; max-width: 320px; text-align: left; padding: 10px 12px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }
.atom-tip { margin: 0 0 8px; color: var(--muted); line-height: 1.6; }
.atom-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.atom-table td { padding: 3px 6px; border-bottom: 1px dashed var(--line); }
.atom-table td:first-child { color: var(--muted); width: 55%; }
.atom-table td:last-child { font-weight: 600; text-align: right; }
.atom-table tr:last-child td { border-bottom: none; }
.atom-electron { animation: atomSpin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
.atom-electron circle { transition: r .3s ease; }
@keyframes atomSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.nuc-p, .nuc-n { opacity: .9; }
.nuc-p { animation: nucPulse 1.2s ease-in-out infinite; }
.nuc-n { animation: nucPulse 1.8s ease-in-out infinite; }
@keyframes nucPulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

/* 元素周期表格子 */
.fig-element { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.el-wrap { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
.element-cell {
  position: relative; width: 130px; height: 150px; flex: none;
  background: var(--surface); border: 3px solid var(--brand); border-radius: 12px;
  display: grid; grid-template-columns: 1fr; grid-template-rows: 26px 1fr 26px 26px;
  padding: 8px; box-shadow: var(--shadow-sm);
}
.element-cell .el-num { font-size: 1rem; font-weight: 700; color: var(--brand); text-align: left; }
.element-cell .el-symbol { font-size: 2.4rem; font-weight: 800; color: var(--ink); text-align: center; line-height: 1.15; }
.element-cell .el-name { font-size: 1rem; font-weight: 600; color: var(--muted); text-align: center; }
.element-cell .el-mass { font-size: .9rem; color: var(--muted); text-align: right; padding-right: 2px; }
.el-legend { display: flex; flex-direction: column; gap: 8px; font-size: .85rem; color: var(--muted); text-align: left; }
.el-legend span { display: inline-flex; align-items: center; gap: 6px; }
.el-legend span::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--brand); border-radius: 3px; flex: none; }
.el-tip { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }

/* ---------- 暗色模式 ---------- */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --ink: #d9e9e7;
    --muted: #8faaa7;
    --paper: #0f2225;
    --surface: #163033;
    --line: #265053;
    --brand: #5cc4bc;
    --brand-soft: #1d3f42;
    --accent: #f09a5b;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-md: 0 6px 18px rgba(0, 0, 0, .35);
  }
  .takeaway { background: #1d3f42; border-left-color: #5cc4bc; }
  .note-block { background: #3a2c18; border-left-color: #f09a5b; }
  .option.is-correct { background: #1d3a2a; }
  .option.is-wrong { background: #442627; }
  .option.is-marked { background: #1d3a2a; }
  .feedback.fb-ok { color: #6fd6a0; }
  .feedback.fb-ko { color: #f0928c; }
  .q-topic { background: #26373d; color: #9db4ba; }
  .weak-tag { background: #442627; color: #f0928c; border-color: #6b3a3a; }
  .badge-safety { background: #4a3417; color: #f5b971; }
  .q-diff[data-diff="提升"] { background: #4a3417; color: #f5b971; }
  .q-diff[data-diff="挑战"] { background: #55281f; color: #f39c7e; }
  .air-tube line { stroke: #d9e9e7; }
  .cyl-scale { stroke: #8faaa7; }
  .day-card.is-done { background: #1d3f42; }
}

/* ---------- 学习页：上一课 / 回到首页 / 下一课流转 ---------- */
.day-nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: stretch; margin: 14px 0; }
.day-nav a { text-decoration: none; font-weight: 700; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm); display: block; }
.day-nav a:hover, .day-nav a:active { border-color: var(--brand); background: var(--brand-soft); }
.day-nav .is-dim { color: var(--muted); font-weight: 600; padding: 12px 14px; opacity: .6; border: 1px dashed var(--line); border-radius: 12px; }
.day-nav .dn-prev, .day-nav .dn-next { min-height: 44px; }
.day-nav .dn-home { flex: 0 0 auto; border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.day-nav .dn-prev { margin-right: auto; }
.day-nav .dn-next { margin-left: auto; }
.day-nav.day-nav--bottom { margin: 28px 0 12px; border-top: 1px solid var(--line); padding-top: 18px; }
.day-nav .dn-home { order: 1; }
.day-nav .dn-prev { order: 0; }
.day-nav .dn-next { order: 2; }

/* ---------- 学习页：本课记录（已读 + 笔记） ---------- */
.reading .reading-state { font-weight: 700; color: var(--muted); margin: 8px 0; }
.reading .note-label { display: block; margin: 16px 0 6px; font-weight: 700; }
.reading textarea#day-note { width: 100%; min-height: 96px; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); resize: vertical; }
.reading textarea#day-note:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.primary.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--brand); }
.primary.ghost:hover { background: var(--brand-soft); }

/* ---------- 首页：快速查找 ---------- */
.search-field { display: block; }
.search-field span { display: block; margin-bottom: 6px; color: var(--muted); }
.search-field input { width: 100%; font: inherit; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.search-field input:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
.search-results { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.search-empty { color: var(--muted); margin: 4px 0; }
.search-hit { display: flex; gap: 10px; align-items: flex-start; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.search-hit:hover, .search-hit:active { border-color: var(--brand); }
.sh-tag { flex: none; font-size: .72rem; font-weight: 700; background: var(--brand-soft); color: var(--brand); border-radius: 999px; padding: 2px 9px; margin-top: 2px; }
.sh-body { display: block; font-size: .9rem; color: var(--ink); line-height: 1.5; }
.sh-body b { display: block; color: var(--brand); font-weight: 700; margin-bottom: 2px; }

/* ---------- 首页：数据备份 ---------- */
.backup-section { overflow: visible; }
.backup-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.backup-actions .primary { margin-top: 0; display: inline-flex; align-items: center; }
.backup-actions input[type="file"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.backup-actions label.primary { cursor: pointer; }

/* ---------- 复习页：知识点筛选 ---------- */
.topic-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.topic-chips .chip { text-decoration: none; font-size: .85rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); min-height: 44px; display: inline-flex; align-items: center; }
.topic-chips .chip.is-active { background: var(--brand); border-color: var(--brand); color: #fff; }
.due-toggle { display: inline-block; margin-top: 4px; text-decoration: underline; }

/* ---------- 电解水实验 ---------- */
.fig-ele { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.ele-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.ele-left-gas { transition: all .4s ease; }
.ele-right-gas { transition: all .4s ease; }
.ele-bubbles circle { animation: eleBub 1s ease-in-out infinite; }
@keyframes eleBub { 0%, 100% { opacity: .5; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

/* ---------- 质量守恒实验 ---------- */
.fig-mc { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mc-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.mc-balloon { transition: all .5s ease; }
.mc-smoke circle { animation: mcSmoke 2s ease-out infinite; }
@keyframes mcSmoke { 0% { opacity: .6; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
.mc-flame { animation: mcFlame .3s ease-in-out infinite alternate; }
@keyframes mcFlame { from { opacity: .7; } to { opacity: 1; } }

/* ---------- 水的净化（过滤） ---------- */
.fig-wp { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.wp-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.wp-note { transition: all .3s ease; }
[data-dirty-water] { transition: opacity .4s ease; }
[data-clear-water] { transition: opacity .4s ease; }

/* ---------- 二氧化碳制取装置 ---------- */
.fig-co2 { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.co2-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.co2-bubbles circle { animation: co2Bub 1.2s ease-in-out infinite; }
@keyframes co2Bub { 0%, 100% { opacity: .4; } 50% { opacity: .9; } }
.co2-match { transition: opacity .3s ease; }
.co2-result { transition: all .3s ease; }

/* ---------- 离子形成 ---------- */
.fig-ion { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ion-info { width: 100%; max-width: 320px; }
.ion-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.ion-table th, .ion-table td { padding: 6px 10px; border: 1px solid var(--line); text-align: center; }
.ion-table th { background: var(--brand-soft); font-weight: 700; }
.ion-tip { margin: 8px 0 0; font-size: .85rem; color: var(--muted); line-height: 1.5; }

/* ---------- 知识网络图 ---------- */
.fig-kn { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
.kn-card { width: 100%; max-width: 480px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.kn-header { padding: 10px 14px; color: #fff; font-weight: 700; font-size: .95rem; }
.kn-body { padding: 8px 14px; background: var(--paper); font-size: .85rem; color: var(--muted); }
.kn-days { font-weight: 600; color: var(--ink); }
.kn-hint { font-size: .88rem; color: var(--muted); text-align: center; margin: 0; }

/* ---------- 水资源分布 ---------- */
.fig-wr { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.wr-hint { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }
.wr-legend-box { display: flex; flex-direction: column; gap: 6px; text-align: left; font-size: .9rem; }
.wr-legend { display: flex; align-items: center; gap: 8px; }

/* ---------- CO/CO2 对比表 ---------- */
.fig-co2comp { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 480px; }
.co2comp-hint { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }
.co2-comp-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.co2-comp-table th, .co2-comp-table td { padding: 6px 10px; border: 1px solid var(--line); text-align: center; }
.co2-comp-table th { background: var(--brand-soft); font-weight: 700; }
.co2-comp-table td:first-child { font-weight: 600; color: var(--ink); background: var(--paper); }

/* ---------- 碳同素异形体 ---------- */
.fig-carbon { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.carbon-info { width: 100%; max-width: 360px; }
.carbon-desc { font-size: .88rem; color: var(--muted); line-height: 1.6; margin: 0; padding: 8px 12px; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); }

/* ---------- 燃烧三角 ---------- */
.fig-comb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.comb-hint { margin: 4px 0 0; font-size: .85rem; color: var(--muted); }
.comb-flame-ell { transition: opacity .4s ease; }
.comb-check, .comb-x { transition: opacity .3s ease; }
.comb-result { transition: all .3s ease; }

/* ---------- 化石燃料/新能源 ---------- */
.fig-fuel { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 400px; }
.fuel-hint { font-size: .85rem; color: var(--muted); text-align: center; margin: 0; }
.fuel-card { width: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.fuel-row { display: flex; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: .9rem; }
.fuel-row:last-child { border-bottom: 0; }
.fuel-icon { font-weight: 700; min-width: 40px; color: var(--brand); }
.fuel-note { margin: 0; padding: 8px 14px; font-size: .85rem; color: var(--muted); background: var(--paper); border-radius: 0; }
.fossil-card .fuel-note { color: #b0400f; }
.new-card .fuel-note { color: var(--ok); }

/* ---------- 科学探究排序（触摸拖拽 + ↑↓） ---------- */
.fig-inquiry { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
.inq-instruct { font-size: .88rem; color: var(--muted); margin: 0; }
.inq-keys { font-size: .8rem; }
.inq-slots { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 340px; }
.inq-slot { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 8px 6px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--paper); transition: border-color .2s, background .2s; }
.inq-slot.is-drop-target { border-color: var(--brand); background: var(--brand-soft); }
.slot-num { font-weight: 700; color: var(--brand); font-size: .9rem; min-width: 18px; }
.inq-item { flex: 1; display: inline-flex; align-items: center; padding: 4px 10px; background: var(--surface); border: 1px solid var(--brand); border-radius: 6px; font-size: .85rem; font-weight: 600; color: var(--brand); touch-action: none; cursor: grab; user-select: none; }
.inq-item.is-dragging { opacity: .55; border-style: dashed; }
.fig-inquiry.is-dragging .inq-item { cursor: grabbing; }
.inq-arrows { display: inline-flex; flex-direction: column; gap: 4px; }
.arrow-btn { width: 40px; height: 32px; min-height: 32px; font-size: 1rem; line-height: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.arrow-btn:hover:not(:disabled) { border-color: var(--brand); background: var(--brand-soft); }
.arrow-btn:disabled { opacity: .35; cursor: not-allowed; }
.inq-ctrl { display: flex; gap: 8px; }
.inq-result { font-size: .88rem; width: 100%; text-align: center; }

/* ---------- 控制变量实验设计练习 ---------- */
.fig-dv { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 560px; margin: 0 auto; text-align: left; }
.dv-scenario { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--paper); }
.dv-q { margin: 0 0 10px; font-size: .95rem; line-height: 1.5; }
.dv-fb { margin: 8px 0 0; font-size: .88rem; color: var(--muted); line-height: 1.6; }
.fig-dv .option { font-size: .9rem; }

/* ---------- 相对分子质量计算器（Day14） ---------- */
.fig-mc { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 400px; }
.fig-mc .fig-pill.is-active { background: var(--brand); color: #fff; }
.mc-detail { display: none; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.mc-title { margin: 0 0 8px; font-size: .95rem; font-weight: 700; color: var(--brand); }
.mc-row { display: flex; align-items: center; gap: 4px; font-size: .9rem; padding: 3px 0; }
.mc-el { font-weight: 700; color: var(--ink); }
.mc-n { color: var(--muted); }
.mc-op { color: var(--muted); margin: 0 2px; }
.mc-res { font-weight: 700; color: var(--brand); }
.mc-total { margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: .9rem; font-weight: 700; color: var(--brand-strong); }

/* ---------- 化学方程式书写步骤（Day20） ---------- */
.fig-ew { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; }
.ew-titlebar { font-size: .95rem; font-weight: 700; color: var(--brand); text-align: center; margin-bottom: 4px; }
.ew-step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ew-num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: .85rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ew-body { flex: 1; }
.ew-title { font-size: .9rem; font-weight: 700; color: var(--ink); }
.ew-badge { font-size: .75rem; margin-left: 6px; }
.ew-desc { font-size: .82rem; color: var(--muted); margin: 2px 0; }
.ew-example { font-size: .85rem; font-family: "Courier New", monospace; color: var(--brand-strong); background: var(--paper); padding: 4px 8px; border-radius: 6px; margin-top: 4px; word-break: break-all; }
.ew-hint { font-size: .82rem; color: var(--muted); text-align: center; margin: 0; }

/* ---------- 配平练习（Day21） ---------- */
.fig-bl { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 440px; }
.fig-bl .fig-pill.is-active { background: var(--brand); color: #fff; }
.bl-panel { display: none; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
.bl-equation { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 1rem; font-family: "Courier New", monospace; margin-bottom: 10px; }
.bl-input-row { display: inline-flex; align-items: center; gap: 2px; }
.bl-input { width: 32px; height: 30px; text-align: center; border: 2px solid var(--line); border-radius: 6px; font-size: 1rem; font-weight: 700; color: var(--brand-strong); background: var(--paper); }
.bl-input:focus { border-color: var(--brand); outline: none; }
.bl-arrow { font-size: 1.2rem; color: var(--muted); margin: 0 4px; }
.bl-btn { padding: 6px 16px; border: 1px solid var(--brand); border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-size: .88rem; font-weight: 600; cursor: pointer; touch-action: manipulation; }
.bl-btn:hover { background: var(--brand); color: #fff; }
.bl-result { margin-top: 8px; font-size: .9rem; font-weight: 700; }
.bl-ok { color: var(--ok); }
.bl-no { color: var(--ko); }
.bl-hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.bl-hint2 { font-size: .82rem; color: var(--muted); text-align: center; margin: 0; }

/* ---------- 方程式计算步骤（Day22） ---------- */
.fig-ec { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 420px; }
.ec-titlebar { font-size: .95rem; font-weight: 700; color: var(--brand); text-align: center; margin-bottom: 4px; }
.ec-step { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.ec-step-n { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #2f9aa8); color: #fff; font-size: .9rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.ec-step-body { flex: 1; }
.ec-step-title { font-size: .9rem; font-weight: 700; color: var(--ink); }
.ec-step-desc { font-size: .82rem; color: var(--muted); margin-top: 2px; }
.ec-example { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.ec-q { margin: 0 0 8px; font-size: .9rem; font-weight: 600; color: var(--ink); }
.ec-solve { font-size: .85rem; line-height: 1.8; font-family: "Courier New", monospace; color: var(--ink); }
.ec-step-tag { display: inline-block; width: 20px; font-weight: 700; color: var(--brand); }
.ec-hint { font-size: .82rem; color: var(--muted); text-align: center; margin: 0; }

@media (prefers-color-scheme: dark) {
  .topic-chips .chip.is-active { background: var(--brand); color: #08191b; }
  .search-hit { background: #163033; }
  .dv-scenario { background: #12282b; }
  .inq-slot { background: #12282b; }
  .mc-detail, .ec-example { background: #12282b; }
  .bl-input { background: #12282b; }
  .ew-example { background: #12282b; }
}

/* ---------- 知识链条互动图（Day15） ---------- */
.fig-kc { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 440px; }
.kc-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.kc-pill { padding: 6px 12px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .85rem; font-weight: 600; color: var(--ink); cursor: pointer; transition: all .2s; }
.kc-pill.is-active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
.kc-arrow { display: inline-flex; align-items: center; color: var(--muted); font-size: 1rem; padding: 0 2px; }
.kc-detail { display: none; width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.kc-title { margin: 0 0 4px; font-size: .95rem; font-weight: 700; color: var(--brand); }
.kc-desc { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.5; }
.kc-hint { font-size: .82rem; color: var(--muted); text-align: center; margin: 0; }

/* ---------- 碳单质性质对比（Day24） ---------- */
.fig-cc { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 420px; }
.cc-row { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.cc-hdr { background: var(--brand-soft); }
.cc-cell { flex: 1; padding: 8px 6px; font-size: .82rem; text-align: center; border-right: 1px solid var(--line); }
.cc-cell:last-child { border-right: none; }
.cc-hdr .cc-cell { font-weight: 700; color: var(--brand-strong); }
.cc-name { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.cc-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.fig-cc [data-cc-i] { cursor: pointer; transition: background .15s; }

<script>(function () {
  "use strict";

  var app = document.querySelector("#app");
  var manifest = (window.ChemLabManifestS2 && window.ChemLabManifestS2.days) || [];
  var params = new URLSearchParams(window.location.search);
  var requestedDay = params.get("day");
  var requestedView = params.get("view");

  var LS_DAY = "chemlab-g9:v4:s2:day-";
  var LS_REVIEW = "chemlab-g9:v4:s2:review";

  // ---------- 基础工具 ----------
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function readJSON(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function writeJSON(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* 本地存储不可用时静默失败，不影响当次学习 */
    }
  }

  function bestOf(attempts) {
    return attempts.reduce(function (m, a) {
      return Math.max(m, a.score);
    }, 0);
  }

  // 旧版记录（{score,total,...}）迁移为新版（{attempts, read, note, ...}）。
  function normalizeDayRecord(record) {
    if (!record) return null;
    var out = {};
    if (Array.isArray(record.attempts)) {
      out.attempts = record.attempts;
      out.best = record.best != null ? record.best : bestOf(record.attempts);
    } else if (typeof record.score === "number") {
      var attempt = {
        score: record.score,
        total: record.total,
        answers: record.answers || [],
        completedAt: record.completedAt || new Date().toISOString()
      };
      out.attempts = [attempt];
      out.best = attempt.score;
    } else {
      // 允许"仅读过 + 笔记"但没有作答记录的天也存在（read=true 或 note 非空）。
      if (!record.read && !record.note) return null;
      out.attempts = [];
      out.best = 0;
      out.read = !!record.read;
      out.readAt = record.readAt || null;
      out.note = typeof record.note === "string" ? record.note : "";
      return out;
    }
    // 附加字段：是否已读完、阅读时间、单课笔记。
    out.read = !!record.read;
    out.readAt = record.readAt || null;
    out.note = typeof record.note === "string" ? record.note : "";
    return out;
  }

  function dayRecord(dayKey) {
    return normalizeDayRecord(readJSON(LS_DAY + dayKey));
  }

  function saveDayRecord(dayKey, record) {
    writeJSON(LS_DAY + dayKey, record);
  }

  function getProgress() {
    var progress = {};
    manifest.forEach(function (d) {
      var record = dayRecord(d.day);
      if (record) progress[d.day] = record;
    });
    return progress;
  }

  function getReviewQueue() {
    return readJSON(LS_REVIEW) || [];
  }

  function getDay(dayKey) {
    return window.ChemLabContentS2 && window.ChemLabContentS2["day-" + dayKey];
  }

  function getQuiz(dayKey) {
    return window.ChemLabQuizS2 && window.ChemLabQuizS2["day-" + dayKey];
  }

  function metaFor(dayKey) {
    return manifest.filter(function (d) { return d.day === dayKey; })[0];
  }

  function moduleIndexFor(dayKey) {
    var meta = metaFor(dayKey);
    if (!meta || !meta.module || !window.ChemLabManifestS2 || !window.ChemLabManifestS2.modules) return 0;
    var idx = window.ChemLabManifestS2.modules.findIndex(function (m) { return m.name === meta.module; });
    return idx < 0 ? 0 : idx;
  }

  // ---------- 激励层：连续学习天数 / 连击 / 成就 / 薄弱点 ----------
  var LS_STATS = "chemlab-g9:v4:s2:stats";

  function getStats() {
    var s = readJSON(LS_STATS) || {};
    s.achievements = Array.isArray(s.achievements) ? s.achievements : [];
    s.bestCombo = typeof s.bestCombo === "number" ? s.bestCombo : 0;
    return s;
  }

  function saveStats(s) {
    writeJSON(LS_STATS, { achievements: s.achievements, bestCombo: s.bestCombo, reviewCleared: !!s.reviewCleared });
  }

  function localDateKey(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  // 连续学习天数：从今天（若今天未学则从昨天）往前数连续的自然日。
  function getStreak() {
    var active = {};
    manifest.forEach(function (md) {
      var rec = dayRecord(md.day);
      if (!rec) return;
      // 作答与"读完本课"都算当天的学习活动，利于连续天数激励。
      if (rec.read && rec.readAt) active[localDateKey(new Date(rec.readAt))] = true;
      rec.attempts.forEach(function (a) {
        if (a.completedAt) active[localDateKey(new Date(a.completedAt))] = true;
      });
    });
    if (!Object.keys(active).length) return 0;
    var cursor = new Date();
    if (!active[localDateKey(cursor)]) cursor.setDate(cursor.getDate() - 1);
    var streak = 0;
    while (active[localDateKey(cursor)]) {
      streak += 1;
      cursor.setDate(cursor.getDate() - 1);
    }
    return streak;
  }

  // 薄弱知识点：从错题队列按题目 topic 聚合，附带命中的学习日便于跳转。
  function getWeakTopics() {
    var queue = getReviewQueue();
    var topics = {};
    queue.forEach(function (item) {
      var quiz = getQuiz(item.day);
      var q = quiz && quiz.questions[item.questionIndex];
      var topic = (q && q.topic) || "未标注";
      topics[topic] = topics[topic] || { count: 0, days: {}, samples: 0 };
      topics[topic].count += 1;
      topics[topic].days[item.day] = true;
    });
    return Object.keys(topics).map(function (t) {
      var o = topics[t];
      return { topic: t, count: o.count, days: Object.keys(o.days) };
    }).sort(function (a, b) { return b.count - a.count; }).slice(0, 5);
  }

  // 成就定义：全部基于本地数据判定，离线可用。
  var ACHIEVEMENTS = [
    { id: "first-step", ico: "★", name: "迈出第一步", desc: "完成任意一天的学习" },
    { id: "days-5",     ico: "◆", name: "坚持五关",   desc: "累计完成 5 天学习" },
    { id: "all-correct",ico: "✔", name: "一次全对",   desc: "某次测验拿到满分" },
    { id: "challenge",  ico: "♛", name: "挑战者",     desc: "全对且包含挑战题" },
    { id: "combo-5",    ico: "▲", name: "连击高手",   desc: "单次连对 5 题" },
    { id: "streak-3",   ico: "✦", name: "三天不断",   desc: "连续学习 3 天" },
    { id: "streak-7",   ico: "❖", name: "一周坚持",   desc: "连续学习 7 天" },
    { id: "review-clear", ico: "●", name: "错题清零", desc: "完成一轮错题复习" }
  ];

  function evaluateAchievements(progress, stats) {
    var unlocked = {};
    stats.achievements.forEach(function (id) { unlocked[id] = true; });
    var completedCount = Object.keys(progress).length;
    if (completedCount >= 1) unlocked["first-step"] = true;
    if (completedCount >= 5) unlocked["days-5"] = true;
    var hasFull = false, hasFullChallenge = false, maxCombo = stats.bestCombo;
    Object.keys(progress).forEach(function (key) {
      var rec = progress[key];
      rec.attempts.forEach(function (a) {
        if (a.score === a.total) {
          hasFull = true;
          var quiz = getQuiz(key);
          var hasChallenge = quiz && quiz.questions.some(function (q) { return q.difficulty === "挑战"; });
          if (hasChallenge) hasFullChallenge = true;
        }
      });
    });
    if (hasFull) unlocked["all-correct"] = true;
    if (hasFullChallenge) unlocked["challenge"] = true;
    if (maxCombo >= 5) unlocked["combo-5"] = true;
    if (getStreak() >= 3) unlocked["streak-3"] = true;
    if (getStreak() >= 7) unlocked["streak-7"] = true;
    if (stats.reviewCleared) unlocked["review-clear"] = true;

    // 更新已解锁列表（持久化，避免重复判定造成闪烁）。
    var changed = false;
    ACHIEVEMENTS.forEach(function (a) {
      if (unlocked[a.id] && stats.achievements.indexOf(a.id) === -1) {
        stats.achievements.push(a.id);
        changed = true;
      }
    });
    if (changed) saveStats(stats);
    return ACHIEVEMENTS.map(function (a) {
      return { id: a.id, ico: a.ico, name: a.name, desc: a.desc, unlocked: !!unlocked[a.id] };
    });
  }

  function miniChart(attempts, modClass) {
    if (attempts.length < 2) return "";
    var n = attempts.length;
    var w = 100, h = 20, pad = 3;
    var max = Math.max(1, attempts[0].total);
    var step = n > 1 ? (w - pad * 2) / (n - 1) : 0;
    var points = attempts.map(function (a, i) {
      var x = pad + i * step;
      var y = h - pad - (a.score / max) * (h - pad * 2);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    return '<svg class="mini-chart" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true"><polyline points="' + points.join(" ") + '"/></svg>';
  }

  // ---------- 快速索引：跨天关键词搜索（单文件内所有内容均已内联时最全） ----------
  // 惰性建立索引：只扫描已加载/内联的内容，分离模式下内容不足时退化到仅搜标题。
  var _indexCache = null;
  function buildIndex() {
    if (_indexCache) return _indexCache;
    var idx = [];
    var keywords = function (s) { return String(s).toLowerCase(); };
    manifest.forEach(function (d) {
      if (!d.ready) return;
      var day = getDay(d.day);
      var quiz = getQuiz(d.day);
      if (day) {
        day.sections.forEach(function (sec) {
          idx.push({ day: d.day, kind: "章节", text: sec.title });
          (sec.body || []).forEach(function (p) {
            idx.push({ day: d.day, kind: "内容", text: typeof p === "string" ? p : (p && p.text) });
          });
        });
        idx.push({ day: d.day, kind: "目标", text: day.coreQuestion });
        idx.push({ day: d.day, kind: "自测", text: (day.checkpoint && day.checkpoint.title) || "" });
      }
      if (quiz) {
        quiz.questions.forEach(function (q) {
          idx.push({ day: d.day, kind: "题干", text: q.prompt });
          idx.push({ day: d.day, kind: "解析", text: q.explanation });
        });
      }
    });
    _indexCache = idx;
    return idx;
  }

  function searchIndex(query) {
    var q = String(query).trim().toLowerCase();
    if (!q) return [];
    var meta = {};
    manifest.forEach(function (d) { meta[d.day] = d.title; });
    var out = [];
    var seen = {};
    buildIndex().forEach(function (item) {
      if (item.text && String(item.text).toLowerCase().indexOf(q) !== -1) {
        var key = item.day + item.text;
        if (seen[key]) return;
        seen[key] = true;
        out.push({ day: item.day, title: meta[item.day], kind: item.kind, text: item.text });
      }
    });
    return out.slice(0, 20);
  }

  // ---------- 数据备份：导出 / 导入（缓解本地记录丢失风险） ----------
  var BACKUP_KEY = "chemlab-g9:v4:s2:backup-meta";
  function collectAllData() {
    var data = { system: "chemlab-g9", version: 3, exportedAt: new Date().toISOString(), days: {}, review: [], stats: null };
    manifest.forEach(function (d) {
      var rec = dayRecord(d.day);
      if (rec) data.days[d.day] = rec;
    });
    data.review = getReviewQueue();
    data.stats = readJSON(LS_STATS);
    return data;
  }

  function exportBackup() {
    var data = collectAllData();
    var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    var d = new Date();
    a.download = "chemlab-g9-backup-" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (data.system !== "chemlab-g9" || !data.days) throw new Error("备份文件格式不正确");
        manifest.forEach(function (d) {
          if (data.days[d.day]) saveDayRecord(d.day, data.days[d.day]);
        });
        if (Array.isArray(data.review)) writeJSON(LS_REVIEW, data.review);
        if (data.stats) {
          writeJSON(LS_STATS, { achievements: data.stats.achievements || [], bestCombo: data.stats.bestCombo || 0, reviewCleared: !!data.stats.reviewCleared });
        }
        writeJSON(BACKUP_KEY, { importedAt: new Date().toISOString() });
        window.location.reload();
      } catch (e) {
        window.alert("导入失败：备份文件无法识别。");
      }
    };
    reader.readAsText(file);
  }

  // 按模块统计完成情况，渲染成可展开列表（环形图 + 名称 + 该模块每天明细）。
  function renderModuleProgress(progress) {
    if (!window.ChemLabManifestS2 || !window.ChemLabManifestS2.modules) return "";
    var modules = window.ChemLabManifestS2.modules;
    return modules.map(function (mod, idx) {
      var daysInMod = manifest.filter(function (d) {
        return d.module === mod.name;
      });
      if (!daysInMod.length) return "";
      var done = daysInMod.filter(function (d) { return progress[d.day]; }).length;
      var frac = daysInMod.length ? done / daysInMod.length : 0;
      var R = 16, C = 2 * Math.PI * R;
      var ring =
        '<svg class="mod-ring" viewBox="0 0 40 40" role="img" aria-label="' +
        escapeHtml(mod.name) + " 完成 " + done + " / " + daysInMod.length + '">' +
          '<circle cx="20" cy="20" r="' + R + '" class="ring-bg"/>' +
          '<circle cx="20" cy="20" r="' + R + '" class="ring-fg" stroke-dasharray="' +
            (frac * C) + " " + C + '" transform="rotate(-90 20 20)"/>' +
        "</svg>";
      var dayList = daysInMod.map(function (d) {
        var rec = progress[d.day];
        var st = !d.ready ? "开发中" : (rec ? "最佳 " + rec.best + "/" + rec.attempts[0].total : "未开始");
        return "<li><span>DAY " + d.day + " · " + escapeHtml(d.title) + "</span><b>" + st + "</b></li>";
      }).join("");
      return (
        '<details class="mod-block mod-' + idx + '">' +
          "<summary>" + ring +
            '<span class="mod-name">' + escapeHtml(mod.name) + "</span>" +
            '<span class="mod-count">' + done + " / " + daysInMod.length + "</span>" +
          "</summary>" +
          '<ul class="mod-days">' + dayList + "</ul>" +
        "</details>"
      );
    }).join("");
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("加载失败：" + src)); };
      document.body.appendChild(s);
    });
  }

  // 空气成分环形图：按体积分数绘制，配图例。
  function figAirComposition(fig) {
    var cx = 90, cy = 90, r = 58;

    var segs = [
      { label: "氮气", pct: "78%", v: 0.78, color: "#4aa7a0" },
      { label: "氧气", pct: "21%", v: 0.21, color: "#e67b32" },

      { label: "其他气体和杂质", pct: "0.03%", v: 0.0003, color: "#c2534f" }
    ];
    var offset = 0;
    var rings = segs.map(function (s) {
      var len = Math.max(s.v * C, 0.5);
      var dash = len + " " + C;
      var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color +
        '" stroke-width="20" stroke-dasharray="' + dash + '" stroke-dashoffset="' + (-offset) +
        '" transform="rotate(-90 ' + cx + " " + cy + ')" opacity="0.92"/>';
      offset += len;
      return seg;
    }).join("");
    var legend = segs.map(function (s) {
      return (
        '<div class="air-legend"><span class="swatch" style="background:' + s.color + '"></span>' +
        "<span>" + s.label + " · " + s.pct + "</span></div>"

    return (
      '<div class="air-wrap">' +
        figSvg(180, 180, rings) +
        '<div class="air-legend-box" role="list" aria-label="空气成分">' + legend + "</div>" +

  // ---------- 分子运动模拟：气体/液体/固体 + 温度控制 ----------
  function figMoleculeMotion(fig) {
    var states = [
      { key: "solid", label: "固态", color: "#4aa7a0", spacing: "紧密", motion: "振动", n: 16 },
      { key: "liquid", label: "液态", color: "#2f9aa8", spacing: "较近", motion: "滑动", n: 16 },
      { key: "gas", label: "气态", color: "#e67b32", spacing: "远", motion: "快速无规则", n: 16 }
    ];
    var pills = states.map(function (s) {
      return '<button type="button" class="fig-pill" data-state="' + s.key + '">' + s.label + '</button>';
    }).join("");
    var particles = states.map(function (s) {
      var cx = 40, cy = 40, r = 5, spacing = s.key === "solid" ? 12 : (s.key === "liquid" ? 14 : 28);
      var cols = s.key === "solid" ? 4 : (s.key === "liquid" ? 4 : 3);
      var dots = "";
      for (var i = 0; i < s.n; i++) {
        var col = i % cols, row = Math.floor(i / cols);
        var x = cx + col * spacing + (s.key === "liquid" ? Math.sin(i * 1.3) * 3 : 0);
        var y = cy + row * spacing + (s.key === "gas" ? (Math.random() - 0.5) * 10 : 0);
        dots += '<circle class="mol-particle" data-state="' + s.key + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4" fill="' + s.color + '" opacity="0.85"/>';
      }
      return dots;
    }).join("");
    var svgInner =
      '<g class="mol-solid" data-mol="solid">' + particles.split('data-state="gas"')[0].split('data-state="liquid"')[0] + '</g>' +
      '<line x1="10" y1="72" x2="110" y2="72" stroke="#d9e8e5" stroke-width="1" stroke-dasharray="4,3"/>' +
      '<g class="mol-liquid" data-mol="liquid">' + particles.split('data-state="gas"')[0].split('data-state="liquid"')[1] + '</g>' +
      '<line x1="10" y1="120" x2="110" y2="120" stroke="#d9e8e5" stroke-width="1" stroke-dasharray="4,3"/>' +
      '<g class="mol-gas" data-mol="gas">' + particles.split('data-state="gas"')[1] + '</g>';
    var descBox = '<div class="mol-desc" data-moldesc>' +
      '<p class="mol-state-name" data-molname>固态</p>' +
      '<p class="mol-desc-text" data-moldtxt>分子排列紧密，只能在固定位置振动。</p>' +
    '</div>';
    return '<div class="fig-mol" data-molfig>' +
      '<div class="fig-ctrl">' + pills + '</div>' +
      figSvg(120, 155, svgInner) +
      descBox +
    '</div>';
  }

  // ---------- 水资源分布饼图 ----------
  function figWaterResources(fig) {
    var cx = 80, cy = 80, r = 55;
    var C = 2 * Math.PI * r;
    var segs = [
      { label: "海洋咸水", pct: "97.5%", v: 0.975, color: "#2a7ab5" },
      { label: "冰川/地下水", pct: "2.4%", v: 0.024, color: "#8a9ba8" },
      { label: "可直接利用淡水", pct: "0.1%", v: 0.001, color: "#e67b32" }
    ];
    var offset = 0;
    var rings = segs.map(function (s) {
      var len = Math.max(s.v * C, 0.5);
      var dash = len + " " + C;
      var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + s.color +
        '" stroke-width="28" stroke-dasharray="' + dash + '" stroke-dashoffset="' + (-offset) +
        '" transform="rotate(-90 ' + cx + " " + cy + ')" opacity="0.9"/>';
      offset += len;
      return seg;
    }).join("");
    var legend = segs.map(function (s) {
      return '<div class="wr-legend"><span class="swatch" style="background:' + s.color + '"></span><span>' + s.label + ' · ' + s.pct + '</span></div>';
    }).join("");
    var center = '<text x="' + cx + '" y="' + (cy - 4) + '" fill="#173033" font-size="11" text-anchor="middle" font-weight="700">地球</text>' +
      '<text x="' + cx + '" y="' + (cy + 10) + '" fill="#587073" font-size="9" text-anchor="middle">71% 被水覆盖</text>';
    return '<div class="fig-wr">' +
      figSvg(160, 160, rings + center) +
      '<div class="wr-legend-box" role="list" aria-label="水资源分布">' + legend + '</div>' +
      '<p class="wr-hint">可直接利用的淡水资源不足全球总水量的 1%。</p>' +

  // ---------- 加载并渲染某一天 ----------
  function renderDay(dayKey) {
    var meta = metaFor(dayKey);
    if (!meta || !meta.ready) {
      renderMissing(dayKey);
      return;
    }

    // 单文件模式：内容已内联，直接渲染。
    var day = getDay(dayKey);
    var quiz = getQuiz(dayKey);
    if (day && quiz) {
      renderLesson(dayKey, day, quiz);
      return;
    }

    app.innerHTML = '<p class="loading">正在准备 Day ' + escapeHtml(dayKey) + " 的化学课……</p>";

    Promise.all([
      loadScript("content-s2/days/day-" + dayKey + ".js"),
      loadScript("quiz-s2/day-" + dayKey + ".js")
    ]).then(function () {
      var d = getDay(dayKey);
      var q = getQuiz(dayKey);
      if (!d || !q) {
        app.innerHTML =
          "<p class='loading'>课程内容未能加载，请检查文件是否完整。</p><p><a href='?'>← 返回首页</a></p>";
        return;
      }
      renderLesson(dayKey, d, q);
    }).catch(function () {
      app.innerHTML =
        "<p class='loading'>课程内容未能加载，请检查文件是否完整。</p><p><a href='?'>← 返回首页</a></p>";
    });
  }

  function renderLesson(dayKey, day, quiz) {
    var saved = dayRecord(dayKey);

    var sections = day.sections.map(function (section) {
      var safetyBadge = section.safety
        ? '<span class="badge badge-safety">⚠️ 需成人陪同</span> '
        : "";
      var body = section.body.map(function (p) {
        if (p && typeof p === "object" && p.text) {
          var kindClass = p.kind === "takeaway" ? " takeaway" : (p.kind === "note" ? " note-block" : "");
          return '<p class="' + kindClass.trim() + '">' + escapeHtml(p.text) + "</p>";
        }
        return "<p>" + escapeHtml(p) + "</p>";
      }).join("");
      var figure = section.figure ? renderFigure(section.figure) : "";
      return (
        '<section class="section">' +
          "<h2>" + safetyBadge + escapeHtml(section.title) + "</h2>" +
          body +
          figure +
        "</section>"
      );
    }).join("");

    var checkpoint = day.checkpoint
      ? '<section class="section checkpoint">' +
          "<h2>" + escapeHtml(day.checkpoint.title) + "</h2>" +
          '<p class="hint">点开每一条，先自己判断，再看解析。</p>' +
          day.checkpoint.items.map(function (item) {
            var mark = item.verdict === "对" ? "✔ 对。" : "✘ 错。";
            return (
              '<details class="checkpoint-item">' +
                "<summary>" + escapeHtml(item.statement) + "</summary>" +
                "<p>" + mark + escapeHtml(item.explanation) + "</p>" +
              "</details>"
            );
          }).join("") +
        "</section>"
      : "";

    var questions = quiz.questions.map(function (q, index) {
      var tags =
        '<span class="q-tags">' +
          (q.difficulty ? '<span class="q-diff" data-diff="' + escapeHtml(q.difficulty) + '">' + escapeHtml(q.difficulty) + "</span>" : "") +
          (q.topic ? '<span class="q-topic">' + escapeHtml(q.topic) + "</span>" : "") +
        "</span>";
      var options = q.options.map(function (option, optionIndex) {
        return (
          '<label class="option"><input type="radio" name="q' + index + '" value="' + optionIndex + '"> ' +
          escapeHtml(option) + "</label>"
        );
      }).join("");
      return (
        '<fieldset class="question" data-answer="' + escapeHtml(q.answer) + '" data-explanation="' + escapeHtml(q.explanation) + '">' +
          "<legend>" + tags + "<strong>" + (index + 1) + ". " + escapeHtml(q.prompt) + "</strong></legend>" +
          options +
        "</fieldset>"
      );
    }).join("");

    var totalQ = quiz.questions.length;

    // 上一课 / 回到首页 / 下一课（仅在 ready 天内流转，跳过未发布天）。页面上下各放一套。
    function dayNavHtml(mod) {
      var dayIndexes = [];
      manifest.forEach(function (d, i) { if (d.ready) dayIndexes.push(i); });
      var cur = dayIndexes.indexOf(parseInt(dayKey, 10) - 1);
      var prevReady = cur > 0 ? manifest[dayIndexes[cur - 1]] : null;
      var nextReady = cur >= 0 && cur < dayIndexes.length - 1 ? manifest[dayIndexes[cur + 1]] : null;
      return '<nav class="day-nav' + (mod ? " " + mod : "") + '" aria-label="课程流转">' +
        (prevReady
          ? '<a class="dn-prev" href="?day=' + prevReady.day + '" title="DAY ' + prevReady.day + " " + escapeHtml(prevReady.title) + '">← 上一课</a>'
          : '<span class="dn-prev is-dim">← 第一课</span>') +
        '<a class="dn-home" href="?">回到首页</a>' +
        (nextReady
          ? '<a class="dn-next" href="?day=' + nextReady.day + '" title="DAY ' + nextReady.day + " " + escapeHtml(nextReady.title) + '">下一课 →</a>'
          : '<span class="dn-next is-dim">已是最后一课</span>') +
        "</nav>";
    }

    app.innerHTML =
      '<div class="page">' +
        dayNavHtml() +
        '<header class="hero">' +
          '<p class="eyebrow">DAY ' + escapeHtml(day.dayNumber) + "</p>" +
          "<h1>" + escapeHtml(day.title) + "</h1>" +
          '<p class="meta">预计 ' + escapeHtml(day.duration) + " · 难度 " + escapeHtml(day.difficulty) + "</p>" +
          "<p><strong>今天的问题：</strong>" + escapeHtml(day.coreQuestion) + "</p>" +
          (saved
            ? '<p class="hint">✔ 已完成 · 最佳 ' + saved.best + " / " + saved.attempts[0].total +
              " · 最近 " + new Date(saved.attempts[saved.attempts.length - 1].completedAt).toLocaleDateString() +
              (saved.attempts.length > 1 ? " · 共尝试 " + saved.attempts.length + " 次" : "") + "</p>"
            : "") +
        "</header>" +
        sections +
        checkpoint +
        '<section class="section reading">' +
          "<h2>本课记录</h2>" +
          '<p id="read-state" class="reading-state" role="status">' + (saved && saved.read ? "✔ 你已标记本课为已读。" : "还没标记为已读。") + "</p>" +
          '<button type="button" class="primary ghost" id="btn-mark-read">' + (saved && saved.read ? "标记为未读完" : "标记为已读完") + "</button>" +
          '<label class="note-label" for="day-note">我的笔记（保存在本机，便于回看）：</label>' +
          '<textarea id="day-note" rows="4" placeholder="写下你的疑问、要点或错题总结…">' + escapeHtml(saved && saved.note ? saved.note : "") + "</textarea>" +
          '<button type="button" class="primary" id="btn-save-note">保存笔记</button>' +
          '<p id="note-state" class="reading-state" role="status"></p>' +
        "</section>" +
        '<section class="quiz" id="quiz-section">' +
          "<h2>今日练习</h2>" +
          '<p class="hint">先独立作答，再查看解析。</p>' +
          '<form id="quiz-form" novalidate>' +
            '<div class="quiz-progress" aria-hidden="true">' +
              '<span class="qp-text" id="qp-text">已答 0 / ' + totalQ + "</span>" +
              '<span class="qp-bar"><span class="qp-fill" id="qp-fill" style="width:0%"></span></span>' +
            "</div>" +
            questions +
            '<p id="quiz-warning" class="hint warning" hidden>还有题目未作答，请全部完成后再提交。</p>' +
            '<button class="primary" type="submit">提交并查看解析</button>' +
          "</form>" +
          '<p id="result" class="result" tabindex="-1" aria-live="polite"></p>' +
        "</section>" +
        dayNavHtml("day-nav--bottom") +
      "</div>";

    bindOptionSelection();

    // 本课记录：标记已读 / 保存笔记（都写入当天记录）。
    var markRead = document.querySelector("#btn-mark-read");
    var readState = document.querySelector("#read-state");
    if (markRead && readState) {
      markRead.addEventListener("click", function () {
        var rec = dayRecord(dayKey) || { attempts: [], best: 0 };
        rec.read = !rec.read;
        rec.readAt = rec.read ? new Date().toISOString() : null;
        saveDayRecord(dayKey, rec);
        readState.textContent = rec.read ? "✔ 你已标记本课为已读。" : "未标记为已读。";
        markRead.textContent = rec.read ? "标记为未读完" : "标记为已读完";
      });
    }
    var saveNote = document.querySelector("#btn-save-note");
    var noteArea = document.querySelector("#day-note");
    var noteState = document.querySelector("#note-state");
    if (saveNote && noteArea && noteState) {
      saveNote.addEventListener("click", function () {
        var rec = dayRecord(dayKey) || { attempts: [], best: 0 };
        rec.note = noteArea.value;
        if (noteArea.value) rec.read = true; // 写笔记默认视为已读
        saveDayRecord(dayKey, rec);
        noteState.textContent = "笔记已保存。";
      });
    }

    // 配图交互：量筒读数视角切换。
    document.querySelectorAll(".fig-cyl").forEach(function (box) {
      var stage = box.querySelector("[data-cyl-stage]");
      if (!stage) return;
      var eyeGroup = box.querySelector("[data-eye]");
      var sight = box.querySelector("[data-sight]");
      var read = box.querySelector("[data-read]");
      var note = box.querySelector("[data-note]");

      var cx = 92, meniscusY = 78;
      var eyeSvg = function (ex, ey) {
        var dx = cx - ex, dy = meniscusY - ey;
        var dist = Math.max(Math.hypot(dx, dy), 1);
        var px = ex + (dx / dist) * 3;
        var py = ey + (dy / dist) * 3;
        return (
          '<circle class="cyl-eye-body" cx="' + ex + '" cy="' + ey + '" r="8" fill="#fff" stroke="#173033" stroke-width="2"/>' +
          '<circle class="cyl-pupil" cx="' + px + '" cy="' + py + '" r="3" fill="#173033"/>' +
          '<text x="' + ex + '" y="' + (ey - 14) + '" fill="#e67b32" font-size="10" text-anchor="middle">视线</text>'
        );
      };
      var sightSvg = function (ex, ey) {
        return (
          '<line x1="' + ex + '" y1="' + ey + '" x2="' + cx + '" y2="' + meniscusY + '" stroke="#e67b32" stroke-width="2" stroke-dasharray="5 4"/>'
        );
      };
      function applyState(key) {
        var s = CYLINDER_STATES[key];
        if (!s) return;
        box.querySelectorAll(".fig-pill").forEach(function (p) {
          var active = p.dataset.state === key;
          p.classList.toggle("is-active", active);
          p.setAttribute("aria-pressed", active ? "true" : "false");
        });
        if (eyeGroup) eyeGroup.innerHTML = eyeSvg(s.eye.x, s.eye.y);
        if (sight) sight.innerHTML = sightSvg(s.eye.x, s.eye.y);
        if (read) {
          read.setAttribute("cx", s.read.x);
          read.setAttribute("cy", s.read.y);
          read.classList.toggle("is-wrong", !s.correct);
        }
        if (note) note.textContent = s.note;
      }
      box.querySelectorAll(".fig-pill").forEach(function (pill) {
        pill.addEventListener("click", function () { applyState(pill.dataset.state); });
      });
      applyState("level");
    });

    // 配图交互：气密性检查状态切换（不漏气 / 漏气）。
    document.querySelectorAll(".fig-air").forEach(function (box) {
      var bubbles = box.querySelector("[data-bubbles]");
      var airnote = box.querySelector("[data-airnote]");
      var water = box.querySelector("[data-water]");
      function applyAir(key) {
        box.querySelectorAll(".fig-pill").forEach(function (p) {
          var active = p.dataset.air === key;
          p.classList.toggle("is-active", active);
          p.setAttribute("aria-pressed", active ? "true" : "false");
        });
        if (bubbles) bubbles.classList.toggle("is-leak", key === "leak");
        if (water) water.classList.toggle("is-leak", key === "leak");
        if (airnote) {
          airnote.textContent = key === "ok"
            ? "手捂试管外壁，导管口冒出气泡，移开手后导管口一段水柱上升 → 装置不漏气。"
            : "若装置漏气，手捂后导管口几乎无气泡冒出，说明气密性差。";
        }
      }
      box.querySelectorAll(".fig-pill").forEach(function (pill) {
        pill.addEventListener("click", function () { applyAir(pill.dataset.air); });
      });
      applyAir("ok");
    });

    // 蜡烛燃烧交互
    document.querySelectorAll("[data-candle]").forEach(function (box) {
      var flame = box.querySelector("[data-flame]");
      var smoke = box.querySelector("[data-smoke]");
      var wax = box.querySelector("[data-wax]");
      var products = box.querySelector("[data-products]");
      var melt = box.querySelector("[data-melt]");
      var hint = box.querySelector("[data-hint]");
      function setLit(on) {
        if (flame) flame.style.opacity = on ? "1" : "0";
        if (smoke) smoke.style.opacity = on ? "0" : "0.8";
        if (wax) wax.style.opacity = on ? "0.9" : "0";
        if (products) products.style.opacity = on ? "1" : "0";
        if (melt) melt.style.opacity = on ? "1" : "0";
        if (hint) hint.textContent = on
          ? "蜡烛燃烧：熔化（物理变化）+ 生成 CO₂/H₂O（化学变化），两者同时发生。"
          : "点击「点燃」观察蜡烛燃烧过程。";
      }
      box.querySelectorAll(".fig-pill").forEach(function (pill) {
        pill.addEventListener("click", function () {
          setLit(pill.dataset.action === "light");
        });
      });
    });

    // 物质变化判断器
    document.querySelectorAll("[data-judge]").forEach(function (box) {
      var items = [
        { type: "物理", note: "状态改变，没有新物质。" },
        { type: "化学", note: "铁变成了铁锈（新物质）。" },
        { type: "物理", note: "形状改变，没有新物质。" },
        { type: "化学", note: "产生了新物质，有异味和变色。" }
      ];
      box.querySelectorAll(".judge-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var idx = parseInt(btn.dataset.idx);
          var item = items[idx];
          var result = box.querySelector("[data-result]");
          btn.classList.add("is-active");
          box.querySelectorAll(".judge-btn").forEach(function (b) {
            if (b !== btn) b.classList.remove("is-active");
          });

        return slots.map(function (s) {

      function syncArrows() {
        slots.forEach(function (s, i) {
          var ups = s.querySelectorAll("[data-shift='-1']");
          var downs = s.querySelectorAll("[data-shift='1']");
          ups.forEach(function (b) { b.disabled = i === 0; });
          downs.forEach(function (b) { b.disabled = i === slots.length - 1; });
        });
      }
      // 与相邻槽位交换卡片。
      function swap(a, b) {
        if (a < 0 || b < 0 || a >= slots.length || b >= slots.length || a === b) return;
        var itA = slots[a].querySelector(".inq-item");
        var itB = slots[b].querySelector(".inq-item");
        if (itA) slots[b].appendChild(itA);

        var moved = false;
        var dragSlot = null;

        item.addEventListener("pointerdown", function (e) {
          if (e.button !== 0 && e.pointerType !== "touch") return;
          if (e.target.closest(".arrow-btn")) return;
          dragging = true;
          moved = false;
          dragSlot = slot;
          startX = e.clientX;
          startY = e.clientY;
          item.setPointerCapture(e.pointerId);
          item.classList.add("is-dragging");
          box.classList.add("is-dragging");
          e.preventDefault();
        });
        item.addEventListener("pointermove", function (e) {
          if (!dragging) return;
          if (!moved) {
            var dx = e.clientX - startX, dy = e.clientY - startY;
            if (dx * dx + dy * dy < 64) return; // 轻微位移视为点击，不启动拖拽
            moved = true;
          }
          e.preventDefault();
          clearTargets();
          var el = document.elementFromPoint(e.clientX, e.clientY);
          var target = null;
          while (el && el !== box) {
            if (el.classList && el.classList.contains("inq-slot")) { target = el; break; }
            el = el.parentNode;
          }
          if (target && target !== dragSlot) {
            target.classList.add("is-drop-target");
            swap(slots.indexOf(dragSlot), slots.indexOf(target));
            dragSlot = target;
          }
        });
        function endDrag(e) {
          if (!dragging) return;
          dragging = false;
          if (item) item.classList.remove("is-dragging");
          box.classList.remove("is-dragging");
          clearTargets();
          if (moved && item && item.setPointerCapture) {

          }

          slots.forEach(function (s) { s.classList.remove("is-drop-target"); });

          for (var i = 0; i < count; i++) {
