<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/ChemLab-G9-Eng-web/">
  <title>ChemLab-G9 | 九年级化学智能学习平台</title>
<meta name="description" content="九年级化学智能学习平台 - 课程学习、虚拟实验、知识图谱、错题诊断">
<style>
:root{--bg:#f5f7f8;--surface:#fff;--ink:#1a2332;--muted:#6b7c93;--brand:#146c6e;--brand-soft:#e6f5f5;--line:#e2e8f0;--radius:12px;--danger:#ef4444;--warn:#f59e0b;--success:#2e9e63}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
.container{max-width:960px;margin:0 auto;padding:0 20px}
/* Header */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:0;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-size:18px;font-weight:700;color:var(--brand)}
.logo span{color:var(--ink);font-weight:400;font-size:13px;margin-left:6px}
nav{display:flex;gap:4px}
.nav-link{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);text-decoration:none;transition:all .2s}
.nav-link:hover,.nav-link.active{color:var(--brand);background:var(--brand-soft)}
/* Hero */
.hero{background:linear-gradient(135deg,#0d5f61 0%,#2f9aa8 60%,#52b6a4 100%);color:#fff;border-radius:var(--radius);padding:40px 32px;margin:24px 0}
.hero h1{font-size:26px;margin-bottom:10px}
.hero p{opacity:.9;font-size:15px;max-width:560px;margin-bottom:20px}
.hero-stats{display:flex;gap:32px}
.hero-stats .stat{display:flex;flex-direction:column;align-items:center}
.hero-stats .num{font-size:28px;font-weight:700}
.hero-stats .label{font-size:12px;opacity:.8}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:16px 0 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card h3{font-size:15px;margin-bottom:6px;color:var(--brand)}
.card p{font-size:13px;color:var(--muted);line-height:1.5}
.card-btn{margin-top:12px;font-size:13px;color:var(--brand);font-weight:600}
/* Section */
section{margin-bottom:32px}
section h2{font-size:17px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--brand-soft)}
/* Progress list */
.progress-list{display:flex;flex-direction:column;gap:8px}
.progress-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:box-shadow .2s}
.progress-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.progress-item.done{border-left:3px solid var(--success)}
.day-label{font-size:12px;color:var(--muted);min-width:48px}
.day-title{flex:1;font-size:14px;font-weight:500}
.day-meta{display:flex;align-items:center;gap:10px}
/* Badges */
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-done{background:#e6f5f5;color:var(--success)}
.badge-pending{background:#fef3c7;color:var(--warn)}
/* Mastery bar */
.mastery-bar,.mini-bar,.skill-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;min-width:60px}
.mastery-fill,.mini-fill,.skill-fill{height:100%;border-radius:3px;background:var(--success);transition:width .3s}
/* Module section */
.module-section{margin-bottom:28px}
.module-section h3{font-size:15px;color:var(--brand);margin-bottom:12px;padding-left:4px}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s}
.day-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);border-color:var(--brand)}
.day-card.done{border-left:3px solid var(--success)}
.day-num{font-size:12px;color:var(--muted);margin-bottom:4px}
.day-name{font-size:13px;font-weight:600;margin-bottom:8px}
.day-mastery{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
/* Quiz */
.quiz-page header{background:var(--brand-soft)}
.quiz-header{display:flex;align-items:center;gap:12px}
.progress-bar{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.quiz-container{padding:24px 0}
.question-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:680px;margin:0 auto}
.q-meta{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.q-type{font-size:12px;background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:6px}
.q-diff{font-size:12px;padding:2px 8px;border-radius:6px}
.diff-easy{background:#e6f5f5;color:var(--success)}
.diff-medium{background:#fef3c7;color:#92400e}
.diff-hard{background:#fee2e2;color:var(--danger)}
.q-know{font-size:12px;color:var(--muted);margin-left:auto}
.q-prompt{font-size:17px;font-weight:600;margin-bottom:20px;line-height:1.6}
.q-options{display:flex;flex-direction:column;gap:10px}
.q-opt{padding:12px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px;transition:all .15s}
.q-opt:hover{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.selected{border-color:var(--brand);background:var(--brand-soft)}
.q-opt.correct{border-color:var(--success);background:#e6f5f5;color:var(--success)}
.q-opt.wrong{border-color:var(--danger);background:#fee2e2;color:var(--danger)}
.q-input-area{display:flex;gap:10px;margin-bottom:16px}
.q-input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none}
.q-input:focus{border-color:var(--brand)}
.btn-submit{padding:10px 20px;background:var(--brand);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px}
.btn-next{margin-top:16px;padding:10px 24px;background:var(--brand);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;width:100%}
.q-feedback{padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:14px}
.q-feedback.correct{background:#e6f5f5;color:var(--success)}
.q-feedback.wrong{background:#fee2e2;color:var(--danger)}
.q-explanation{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}

/* Quiz progress bar below header */
.quiz-progress-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 0}
.quiz-progress-bar .container{display:flex;align-items:center;gap:12px}
.quiz-progress-bar .progress-bar{flex:1}
.quiz-count{font-size:13px;color:var(--muted);white-space:nowrap}
/* Result */
.result-page{display:flex;align-items:center;justify-content:center;min-height:70vh}
.result-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:48px;text-align:center;max-width:400px;width:100%}
.result-icon{font-size:64px;margin-bottom:16px}
.result-card h2{font-size:22px;margin-bottom:8px}
.result-score{font-size:56px;font-weight:700;color:var(--brand);margin:16px 0}
.result-breakdown{display:flex;justify-content:center;gap:32px;margin:20px 0;padding:16px;background:var(--bg);border-radius:8px}
.rb-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.rb-item strong{font-size:20px;color:var(--ink)}
.result-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.btn-primary,.btn-secondary{padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-weight:600}
.btn-primary{background:var(--brand);color:#fff}
.btn-secondary{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
/* Graph */
.graph-page .container{padding-top:20px}
.kg-container{display:flex;justify-content:center;margin:20px 0}
.kg-container svg{max-width:100%;height:auto}
.kg-node{cursor:pointer;transition:opacity .2s}
.kg-node:hover{opacity:.8}
.kg-legend{display:flex;gap:20px;justify-content:center;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend-dot{width:12px;height:12px;border-radius:50%}
/* Dashboard */
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.dash-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center}
.dash-stat .num{font-size:28px;font-weight:700;color:var(--brand);display:block}
.dash-stat .label{font-size:12px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dash-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.dash-card h3{font-size:15px;margin-bottom:14px}
.skill-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.skill-name{min-width:90px;text-align:right;color:var(--muted)}
.skill-score{min-width:36px;color:var(--muted)}
.rec-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.rec-item:hover .rec-name{color:var(--brand)}
.rec-name{transition:color .2s}
.rec-item:last-child{border-bottom:none}
/* Footer */
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:32px}
/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted)}
/* Responsive */
@media(max-width:640px){
  .hero{padding:24px 20px}
  .hero h1{font-size:20px}
  .hero-stats{gap:16px}
  .hero-stats .num{font-size:22px}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  nav{gap:0}
  .nav-link{padding:6px 8px;font-size:13px}
}

/* Experiment page */
.experiment-page .container{padding-top:16px}
.exp-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.exp-header h2{flex:1;font-size:17px}
.exp-progress{font-size:13px;color:var(--muted);background:var(--brand-soft);padding:4px 12px;border-radius:12px}
.btn-back{padding:6px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:13px}
.exp-body{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.exp-info,.exp-steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.exp-info h3{font-size:14px;color:var(--brand);margin:12px 0 6px}
.exp-info h3:first-child{margin-top:0}
.exp-info p{font-size:13px;color:var(--ink);line-height:1.6}
.equation{font-family:monospace;background:var(--bg);padding:8px 12px;border-radius:6px;font-size:14px}
.safety-list{padding-left:18px;font-size:13px}
.safety-list li{margin-bottom:4px;color:var(--danger)}
.step{display:flex;gap:12px;padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);font-size:13px}
.step.done{background:#f0fdf4;border-color:#bbf7d0}
.step.current{background:var(--brand-soft);border-color:var(--brand)}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.step.current .step-num{background:var(--brand);color:#fff}
.step.done .step-num{background:var(--success);color:#fff}
.step-action{font-weight:600;margin-bottom:4px}
.step-observation{color:var(--muted);font-size:12px}
.exp-observe-area{margin-top:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.exp-observe-area p{font-size:14px;margin-bottom:8px}
.exp-obs-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
.exp-obs-input:focus{border-color:var(--brand)}
.exp-actions{display:flex;gap:10px}
.badge-exp{font-size:10px;background:var(--brand-soft);color:var(--brand);padding:2px 6px;border-radius:6px}
.day-exp{margin-top:6px}
@media(max-width:640px){.exp-body{grid-template-columns:1fr}}

/* Dark mode */
:root.dark {
  --bg: #0d1117;
  --surface: #161b22;
  --surface-alt: #1c2128;
  --line: #30363d;
  --ink: #e6edf3;
  --muted: #8b949e;
  --brand-soft: #1a2332;
}
:root.dark .card,
:root.dark .day-card,
:root.dark .graph-node,
:root.dark .exp-info,
:root.dark .exp-steps,
:root.dark .exp-observe-area,
:root.dark .quiz-option,
:root.dark .result-card {
  background: var(--surface);
  border-color: var(--line);
}
:root.dark .quiz-option:hover,
:root.dark .quiz-option.selected {
  background: var(--brand-soft);
}
:root.dark .stat-card {
  background: var(--surface);
}
:root.dark .exp-obs-input {
  background: var(--bg);
  color: var(--ink);
  border-color: var(--line);
}

/* iPad responsiveness */
@media(min-width:768px) and (max-width:1024px) {
  .container{max-width:960px}
  .course-grid{grid-template-columns:repeat(4,1fr)}
  .graph-node{width:72px;height:72px;font-size:11px}
  .graph-node .node-name{font-size:9px}
  .graph-node .node-mastery{font-size:9px}
  .day-card{padding:14px}
}
@media(max-width:767px){
  .container{padding:12px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .course-grid{grid-template-columns:repeat(3,1fr)}
  .graph-node{width:60px;height:60px;font-size:10px}
  .graph-node .node-name{font-size:8px}
  .graph-node .node-mastery{font-size:8px}
  .day-card{padding:10px}
  .day-name{font-size:11px}
}
</style>
</head>
<body>
<div id="app-root">
  <div class="loading">加载中...</div>
</div>
<script type="module" src="engine/app.js"></script>
</body>
</html>
