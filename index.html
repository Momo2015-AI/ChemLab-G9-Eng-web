<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemLab-G9 | 九年级化学智能学习平台</title>
<meta name="description" content="九年级化学智能学习平台 - 课程学习、虚拟实验、知识图谱、错题诊断">
<link rel="stylesheet" href="frontend/themes/portal-content.css">
<link rel="stylesheet" href="frontend/pages/course/course-guided-learning.css">
<link rel="stylesheet" href="frontend/pages/ai-tutor/ai-tutor-page.css">
<link rel="stylesheet" href="frontend/shell/portal-shell.css">
<link rel="stylesheet" href="frontend/themes/spectral-glow-theme.css">
<link rel="stylesheet" href="frontend/themes/ph-light-theme.css">
</head>
<body>
<div id="app-root"><div class="loading">ChemLab 正在启动…</div></div>
<noscript><section class="page startup-error"><header class="page-header"><h1>ChemLab-G9</h1><p>学习平台需要启用 JavaScript。</p></header><div class="startup-error__body"><p>请在浏览器设置中允许运行 JavaScript，然后刷新本页开始学习。</p></div></section></noscript>
<script type="module">
  import('./app/bootstrap.js').catch(error => {
    console.error('ChemLab module failed to load:', error);
    const root = document.querySelector('#app-root');
    if (root) {
      const message = String(error?.message || error).replace(/[&<>\"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[c]));
      root.innerHTML = `<section class="page startup-error"><header class="page-header"><h1>ChemLab-G9</h1><p>学习平台脚本加载失败。</p></header><div class="startup-error__body"><button type="button" onclick="location.reload()">重新加载</button><details><summary>技术诊断</summary><pre>${message}</pre></details></div></section>`;
    }
  });
</script>
</body>
</html>
