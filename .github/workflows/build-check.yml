name: ChemLab-G9 Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ChemLab engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        run: |
          find engine core lab dashboard app controllers views tests -name '*.js' -o -name '*.mjs' 2>/dev/null | sort | while read f; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      - name: Run tests
        run: npm test

      - name: Validate content JSON
        run: |
          find modules content -name '*.json' | sort | while read f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "JSON OK"

      - name: Check index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html not found — must exist as app entry point"
            exit 1
          fi
          echo "index.html OK"
