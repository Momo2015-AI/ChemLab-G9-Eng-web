name: ChemLab-G9 Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate ChemLab V1.7 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        shell: bash
        run: |
          set -euo pipefail
          find engine core lab dashboard app controllers views tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                node --check "$f"
              done

      - name: Run tests
        run: npm test

      - name: Validate content JSON
        shell: bash
        run: |
          set -euo pipefail
          find modules content -type f -name '*.json' -print0 \
            | sort -z \
            | while IFS= read -r -d '' f; do
                node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
              done
          echo "JSON OK"

      - name: Check index.html exists
        run: |
          test -f index.html
          echo "index.html OK"
