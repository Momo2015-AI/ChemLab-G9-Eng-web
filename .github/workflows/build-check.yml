name: ChemLab-G9 Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        shell: bash
        run: |
          set -euo pipefail
          find app core controllers engine frontend scripts services views tests -type f \( -name '*.js' -o -name '*.mjs' \) -print 2>/dev/null \
            | sort \
            | while IFS= read -r f; do node --check "$f"; done
          echo "JS syntax OK"

      - name: Run test suite
        run: npm test

      - name: Run runtime architecture audit
        run: node scripts/runtime-audit.mjs

      - name: Validate content JSON
        shell: bash
        run: |
          set -euo pipefail
          find modules content schemas -type f -name '*.json' -print0 2>/dev/null \
            | while IFS= read -r -d '' f; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
          echo "JSON OK"

      - name: Run content integrity gates
        run: npm run audit:content

      - name: Check deployment entry
        run: test -f index.html && test -f .github/workflows/deploy-pages.yml
