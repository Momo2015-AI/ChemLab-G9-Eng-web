name: ChemLab-G9 Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate ChemLab V1.7 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        shell: bash
        run: |
          set -euo pipefail
          for dir in engine core app controllers views tests; do
            if [ -d "$dir" ]; then
              find "$dir" -type f \( -name '*.js' -o -name '*.mjs' \) -print
            fi
          done \
            | sort \
            | while IFS= read -r f; do
                node --check "$f"
              done
          echo "JS syntax OK"

      - name: Run tests
        run: npm test

      - name: Validate content JSON
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in modules content; do
            if [ -d "$dir" ]; then
              while IFS= read -r -d '' f; do
                found=1
                node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
              done < <(find "$dir" -type f -name '*.json' -print0 | sort -z)
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No content JSON files found; skipping JSON content validation."
          else
            echo "JSON OK"
          fi

      - name: Check index.html exists
        run: |
          test -f index.html
          echo "index.html OK"
