name: ChemLab-G9 Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate ChemLab engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax (engine/)
        run: |
          for f in engine/*.js; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "engine/ OK"

      - name: Check JS syntax (core/)
        run: |
          find core -name '*.js' | sort | while read f; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "core/ OK"

      - name: Check JS syntax (lab/)
        run: |
          find lab -name '*.js' | sort | while read f; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "lab/ OK"

      - name: Check JS syntax (dashboard/)
        run: |
          find dashboard -name '*.js' | sort | while read f; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
          echo "dashboard/ OK"

      - name: Validate content JSON
        run: |
          find modules -name '*.json' | sort | while read f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
          find content -name '*.json' | sort | while read f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "JSON OK"

      - name: Check index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "index.html not found — must exist as app entry point"
            exit 1
          fi
          echo "index.html OK"
