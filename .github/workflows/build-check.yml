name: ChemLab-G9 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chem-lab-main
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JS syntax
        shell: bash
        run: |
          set -euo pipefail
          roots=(app core controllers engine frontend scripts views tests)
          files=()
          for root in "${roots[@]}"; do
            if [[ -d "$root" ]]; then
              while IFS= read -r -d '' f; do files+=("$f"); done < <(find "$root" -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
            fi
          done
          if (( ${#files[@]} )); then
            printf '%s\0' "${files[@]}" | sort -z | while IFS= read -r -d '' f; do node --check "$f"; done
          fi
          echo "JS syntax OK"

      - name: Run test suite
        run: npm test

      - name: Run runtime architecture audit
        run: node scripts/runtime-audit.mjs

      - name: Validate content JSON
        shell: bash
        run: |
          set -euo pipefail
          roots=(modules content schemas)
          files=()
          for root in "${roots[@]}"; do
            if [[ -d "$root" ]]; then
              while IFS= read -r -d '' f; do files+=("$f"); done < <(find "$root" -type f -name '*.json' -print0)
            fi
          done
          if (( ${#files[@]} )); then
            printf '%s\0' "${files[@]}" | sort -z | while IFS= read -r -d '' f; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
          fi
          echo "JSON OK"

      - name: Run content integrity gates
        run: npm run audit:content

      - name: Check deployment entry
        run: test -f index.html

  deploy:
    name: Deploy ChemLab to GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble runtime-only site
        run: node scripts/build-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
