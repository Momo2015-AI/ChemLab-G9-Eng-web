name: Content Integrity

on:
  push:
    branches: [main]
    paths:
      - 'modules/questions/**'
      - 'modules/lessons/**'
      - 'content/knowledge/**'
      - 'content/review/**'
      - 'scripts/content-integrity-v19.mjs'
      - 'scripts/content-lesson-audit-v19.mjs'
      - '.github/workflows/content-integrity.yml'
  pull_request:
    paths:
      - 'modules/questions/**'
      - 'modules/lessons/**'
      - 'content/knowledge/**'
      - 'content/review/**'
      - 'scripts/content-integrity-v19.mjs'
      - 'scripts/content-lesson-audit-v19.mjs'
      - '.github/workflows/content-integrity.yml'

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run question and knowledge integrity gate
        run: node scripts/content-integrity-v19.mjs
      - name: Run lesson content readiness gate
        if: always()
        run: node scripts/content-lesson-audit-v19.mjs
      - name: Upload content audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-content-audit-reports
          path: reports/
